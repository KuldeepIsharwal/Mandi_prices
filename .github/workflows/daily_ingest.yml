name: Daily Mandi Price Ingestion

on:
  schedule:
    - cron: "0 1 * * *"   # 1:00 AM UTC = ~6:30 AM IST
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r agri-price-pipeline/requirements.txt

      - name: Run ingestion
        run: python ingest.py
        working-directory: agri-price-pipeline/ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATAGOVINDIA_API_KEY: ${{ secrets.DATAGOVINDIA_API_KEY }}
